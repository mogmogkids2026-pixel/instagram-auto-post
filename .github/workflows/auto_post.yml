name: Instagram 自動投稿

on:
  schedule:
    # 毎週 月・水・金 の日本時間 09:00 (UTC 00:00)
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:  # 手動実行ボタン

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # posted_photos.json をコミットするために必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install anthropic requests

      - name: 自動投稿を実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python auto_post.py

      - name: 投稿済み写真の記録をコミット
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add posted_photos.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update posted photos record [skip ci]"
          git push
